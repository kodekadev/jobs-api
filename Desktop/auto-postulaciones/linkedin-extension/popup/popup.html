<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6f8;
      color: #1a1a2e;
    }

    header {
      background: #2A8FA5;
      color: #fff;
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .logo { font-size: 20px; }
    header h1 { font-size: 16px; font-weight: 700; }
    header .subtitle { font-size: 11px; opacity: .8; }

    .card {
      background: #fff;
      margin: 12px;
      border-radius: 10px;
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .row:last-child { margin-bottom: 0; }

    .label { font-size: 13px; color: #555; }
    .value { font-size: 13px; font-weight: 600; }

    /* Toggle switch */
    .toggle-wrap { display: flex; align-items: center; gap: 8px; }
    .toggle-label { font-size: 13px; font-weight: 600; }
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 24px; cursor: pointer;
      transition: .3s;
    }
    .slider:before {
      content: ""; position: absolute;
      width: 18px; height: 18px; left: 3px; bottom: 3px;
      background: #fff; border-radius: 50%; transition: .3s;
    }
    input:checked + .slider { background: #2A8FA5; }
    input:checked + .slider:before { transform: translateX(18px); }

    .stat-number { font-size: 28px; font-weight: 700; color: #2A8FA5; }
    .stat-label  { font-size: 11px; color: #888; margin-top: 2px; }

    button.action {
      width: 100%;
      background: #2A8FA5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background .2s;
    }
    button.action:hover { background: #1E6E82; }
    button.action.secondary {
      background: #fff;
      color: #2A8FA5;
      border: 1.5px solid #2A8FA5;
      margin-top: 8px;
    }
    button.action.secondary:hover { background: #E0F4F8; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
      margin-right: 4px;
    }
    .status-dot.connected  { background: #27ae60; }
    .status-dot.error      { background: #e74c3c; }

    footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      padding: 10px;
    }
    footer a { color: #2A8FA5; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="logo">🤖</div>
  <div>
    <h1>AplicAI</h1>
    <div class="subtitle">LinkedIn Easy Apply</div>
  </div>
</header>

<!-- Estado de conexión -->
<div class="card">
  <div class="row">
    <span class="label">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Verificando...</span>
    </span>
    <span class="value" id="userName" style="font-size:12px;color:#555;"></span>
  </div>
</div>

<!-- Contador del día -->
<div class="card" style="text-align:center; padding: 18px;">
  <div class="stat-number" id="dailyCount">0</div>
  <div class="stat-label">postulaciones hoy</div>
</div>

<!-- Toggles -->
<div class="card">
  <div class="row">
    <span class="label">Extensión activa</span>
    <label class="switch">
      <input type="checkbox" id="toggleEnabled">
      <span class="slider"></span>
    </label>
  </div>
  <div class="row" style="margin-top:10px;">
    <div>
      <div class="toggle-label">Postulación automática</div>
      <div class="label" style="font-size:11px;color:#888;">Postula solo cada día, en segundo plano</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleAutopilot">
      <span class="slider"></span>
    </label>
  </div>
</div>

<!-- Acciones -->
<div class="card">
  <button class="action" id="btnRunAutopilot">▶ Iniciar Autopilot en esta página</button>
  <button class="action secondary" id="btnApplyNow" style="margin-top:8px;">Aplicar al empleo actual</button>
  <button class="action secondary" id="btnSync">Sincronizar perfil</button>
</div>

<footer>
  <a href="#" id="linkOptions">Configuración</a>
</footer>

<script src="popup.js"></script>
</body>
</html>
